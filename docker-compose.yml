services:
  db:
    image: postgres:16-alpine
    container_name: verificaecuador-db
    environment:
      POSTGRES_USER: verifica
      POSTGRES_PASSWORD: verifica
      POSTGRES_DB: verificaecuador
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifica"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: verificaecuador-backend
    environment:
      DATABASE_URL: postgresql://verifica:verifica@db:5432/verificaecuador
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  bot:
    build: ./backend
    container_name: verificaecuador-bot
    command: ["python", "-m", "app.bot"]
    environment:
      DATABASE_URL: postgresql://verifica:verifica@db:5432/verificaecuador
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

volumes:
  pgdata:
