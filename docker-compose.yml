services:
  backend:
    build: ./backend
    container_name: verificaecuador-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  bot:
    build: ./backend
    container_name: verificaecuador-bot
    command: ["python", "-m", "app.bot"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    restart: unless-stopped
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    container_name: verificaecuador-frontend
    ports:
      - "4321:4321"
